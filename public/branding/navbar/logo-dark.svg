<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 100">
  <!-- Suitcase handle -->
  <path d="M27,27 L27,17 Q27,8 36,8 L46,8 Q55,8 55,17 L55,27"
        fill="none" stroke="#ffffff" stroke-width="4.8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left arm of V -->
  <polygon points="2,30 31,30 41,94" fill="#ffffff"/>
  <!-- Right arm of V -->
  <polygon points="80,30 51,30 41,94" fill="#ffffff"/>
  <!-- ALITSA + travel (travel slightly above strict 1/3 for readability) -->
  <text x="70" y="90" fill="#ffffff">
    <tspan font-family="'Arial Black', Impact, 'Helvetica Neue', sans-serif"
           font-size="82" font-weight="900" letter-spacing="-2">ALITSA</tspan>
    <tspan dx="10"
           font-family="'Helvetica Neue', Arial, sans-serif"
           font-size="36" font-weight="500" letter-spacing="0">travel</tspan>
  </text>
</svg>
