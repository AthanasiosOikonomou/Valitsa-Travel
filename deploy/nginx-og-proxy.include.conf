# Trip Open Graph (Facebook / Messenger / WhatsApp link previews)
# Paste inside server { } for valitsatravel.gr, next to nginx-api-location.include.conf.
# These paths MUST reach Node — static try_files alone serves index.html without trip og:image.
#
# After deploy: nginx -t && reload, then Scrape Again in Facebook Sharing Debugger.

location ^~ /og/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header User-Agent $http_user_agent;
    proxy_read_timeout 60s;
}

location = /trips {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header User-Agent $http_user_agent;
}
