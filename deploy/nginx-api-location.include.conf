# Drop-in snippet for nginx when the main site is behind nginx but Express/Passenger
# listens on localhost (Path A: same host as the SPA).
#
# Paste this block INSIDE your server { ... } for valitsatravel.gr, ABOVE any
#   location / { try_files ... } or static root that would steal /api.
#
# Match the port to your Node app: PORT / API_PORT in server env (default 8787), or
# replace 127.0.0.1:8787 with your host’s Passenger/Node socket if applicable.
#
# After editing nginx: nginx -t && reload. /api/health must return JSON.

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    client_max_body_size 12m;
}
