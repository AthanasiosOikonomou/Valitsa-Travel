# Paste into the server { } block for valitsatravel.gr (or include from sites-available).
# Nginx does not read .htaccess — SPA deep links need try_files on the front web server.
#
# If the API is on the same host via Node, keep /api as proxy and only use try_files for the rest.

# Example: API to local Node (adjust socket/port to match your app)
# location /api/ {
#   proxy_pass http://127.0.0.1:8787;
#   proxy_http_version 1.1;
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
# }

location / {
  try_files $uri $uri/ /index.html;
}
