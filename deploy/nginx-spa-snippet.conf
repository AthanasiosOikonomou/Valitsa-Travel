# Nginx does not read .htaccess. For React Router deep links you need ONE of the patterns below.
#
# If you saw many redirects: remove duplicate "location /" blocks, remove any
#   error_page 404 =200 /index.html
#   or rewrite/return chains that send /index.html -> / -> /index.html
# If nginx proxies to Apache: never use Apache [R=301] from /index.html to / (loops with try_files).
# Do not paste this twice. Replace the existing location /, do not append.

# --- Option A: static files on disk (Vite dist/ is root) ---
# Use only two arguments to try_files (no $uri/) — $uri/ can trigger extra redirects
# when folders or index rules exist on the host.
#
# root must point at the folder that contains index.html (your built site root).
#
# location / {
#   root /var/www/.../public_html;
#   try_files $uri /index.html;
# }

# --- Option B (often simplest on Node hosts): no try_files; let Express serve dist + SPA ---
# Then nginx is not responsible for /admin/login — Node sends index.html.
# Adjust the upstream (port/socket) to match your app. Only ONE handler for location /.
#
# location /api/ {
#   proxy_pass http://127.0.0.1:8787;
#   proxy_http_version 1.1;
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
# }
#
# location / {
#   proxy_pass http://127.0.0.1:8787;
#   proxy_http_version 1.1;
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
# }

# --- Production: use the ready-made /api block (copy or include) ---
# See nginx-api-location.include.conf in this folder — active directives, not comments.
# Place that block before static try_files so GET/PUT/PATCH on /api/* reach Node.
